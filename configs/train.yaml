# ──────────────────────────────────────────────────────────────────────────────
# Main training config. Override any field on the command line, e.g.:
#   python train.py model=deeplabv3plus train.lr=1e-4 train.batch_size=4
# ──────────────────────────────────────────────────────────────────────────────

defaults:
  - model: unet
  - dataset: multiclass
  - augmentation: medium
  - optimizer: adamw
  - loss: dice_ce
  - task: default
  - polar: disabled
  - _self_

# ── Training hyper-parameters ─────────────────────────────────────────────────
train:
  epochs: 150
  batch_size: 4
  img_size: 512           # images are resized to (img_size × img_size)
  num_workers: 4
  seed: 42
  val_interval: 1         # run validation every N epochs
  precision: "32-true"    # "16-mixed" for AMP, "32-true" for full precision
  early_stopping: True
  early_stopping_patience: 30

# ── Hardware / distributed training ──────────────────────────────────────────
hardware:
  accelerator: auto         # "auto", "gpu", "cpu"
  devices: auto             # "auto", integer count, or list e.g. [0,1]
  num_nodes: 1              # number of machines
  strategy: auto            # "auto", "ddp", "ddp_find_unused_parameters_false", "fsdp"

# ── Checkpoint ────────────────────────────────────────────────────────────────
checkpoint:
  monitor: val/dice_mean  # metric to monitor for saving best model
  mode: max
  save_top_k: 1           # saves best.ckpt; last.ckpt is always saved separately
  filename: "best"

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  logger: tensorboard     # "tensorboard" or "wandb"
  project: seg-baseline   # wandb project name (ignored for tensorboard)
  name: "${model.arch}_${model.encoder}_${dataset.name}"
  save_dir: outputs

# ── Evaluation split (used by evaluate.py) ────────────────────────────────────
split: test               # "train", "val", or "test"

# ── Test exports (evaluate.py and the final trainer.test() in train.py) ───────
eval:
  save_csv: true            # evaluate.py: write summary/per_class/per_case CSV
  save_predictions: none    # none | polar | cartesian | both (false/true also accepted)
  prediction_cartesian_size: original  # original | input; polar retains its grid
  save_overlay: false       # (not implemented yet) save colour overlays
  save_quantification_overlays: none  # none | polar | cartesian | both; independent of masks/CSV
  save_quantification_gt_overlays: none  # independent hard-GT overlays in the selected spaces
  quantification_overlay_layout: combined  # combined | separate (prediction hard/soft files)
  quantification_overlay_readouts: both  # hard | soft | both
  quantification_overlay_source: seg_logits  # seg_logits | quantification (adapter if present)
  quantification_overlay_legend: true
  save_fundus_overlays: none  # none | prediction | groundtruth | both; hard measurements on the RGB image
  fundus_overlay_alpha: 0.0  # [0, 1]; optional mask-colour blend beneath measurement lines
  threshold: 0.5            # binary: sigmoid(logits) > threshold
  include_background: false # exclude background from mean_* unless true
  output_dir: null          # default: <save_dir>/<logging.name>/eval/<split>
  per_case: true
  per_class: true

  # OD/PPA research evaluation
  odppa:
    enabled: false

    od_class_id: 1
    ppa_class_id: 2

    # NSD tolerance:
    # tolerance = GT OD equivalent diameter × 0.01
    nsd_tolerance_od_ratio: 0.01

    # If numeric, overrides the ratio above.
    # Example: 2.0 means fixed 2-pixel tolerance.
    nsd_tolerance_px: null

    # Statistical inference
    bootstrap_samples: 10000
    permutation_samples: 100000
    statistics_seed: 42

    # Patient-level clustering
    cluster_key: patient_id

    # Optional:
    # case_id,patient_id,eye,reference_complete
    metadata_csv: null

    # Optional baseline per_case.csv for paired statistics
    reference_csv: null

# ── Multi-task model knobs (Phase 9b; merged into the selected model config) ──
# All OFF by default. Consumed by future custom models that expose decoder
# features / heads; SMP baselines ignore them, so the baseline is unaffected.
model:
  return_features: false
